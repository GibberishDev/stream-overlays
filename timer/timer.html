<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="styles/notifications.css">
    <script defer src="./scripts/utils.js"></script>
    <script defer src="./scripts/notification.js"></script>
    <script defer src="./scripts/ready.js"></script>
    <script defer src="./scripts/integration.js"></script>
    <script defer src="./scripts/audio.js"></script>
    <script defer src="./scripts/settings.js"></script>
    <script defer src="./scripts/index.js"></script>
</head>
<body>
    <span id="fps"></span>
    <button tabindex='-1'  id="open-settings" onclick="showSettingsMenu()">OPEN SETTINGS</button>
    <div id="settings" style="display: none;">
        <div id="settings-wrapper">
            <div id="settings-label">SETTINGS</div>
            <div id="settings-container">
            </div>
            <div id="settings-controls">
                <button tabindex='-1' class="settings-button" onclick="inputSaveSettings()">SAVE</button>
                <button tabindex='-1' class="settings-button" onclick="inputCancelSettings()">CANCEL</button>
                <button tabindex='-1' class="settings-button" onclick="inputResetSettings()">RESET</button>
            </div>
        </div>
        <div id="dropdown-wrapper" style="display: none;">
            <div class="dropdown-list">
            </div>
        </div>
        <div id="settings-bg"><div id="settings-bg-crt"><div id="settings-bg-scanline"></div></div></div>
    </div>
</body>
</html>
